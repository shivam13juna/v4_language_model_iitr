# Step 2 of 3: Porter and Postgres, and Prometheus beside them. compose.yaml adds Grafana too.
#
#   docker compose -f compose.prometheus.yaml up -d   porter and postgres as they were, plus Prometheus   http://localhost:9090

services:
  porter:
    build: .
    image: porter:1.0
    ports:
      - "8080:8080"                    # this machine's port 8080 → the container's 8080
    env_file: .env                     # OPENAI_API_KEY, handed over when the container starts
    environment:
      # Where conversations are kept. "postgres" is the service below: containers in one Compose
      # project reach each other by service name.
      PORTER_POSTGRES_DSN: postgresql://porter:porter@postgres:5432/porter
    volumes:
      - ./online_retail.db:/data/online_retail.db:ro   # the orders, read-only
      - state:/state                   # the ledger: kept when the container is replaced
    depends_on:
      postgres:
        condition: service_healthy     # start porter only once Postgres accepts connections
    restart: unless-stopped            # started again if the process ever exits

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter        # no port is published: only the containers here can reach it
      POSTGRES_DB: porter
    volumes:
      - pgdata:/var/lib/postgresql/data   # the conversations: kept when the container is replaced
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "porter"]   # accepting connections yet?
      interval: 2s
      retries: 15
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"          # this machine only
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

# Named volumes: storage Docker keeps outside every container, so the ledger (return requests and
# refunds) and the conversations survive a new container. Docker creates them on the first `up`;
# only `docker compose down -v` deletes them.
volumes:
  state:
    name: porter-state       # its name in `docker volume ls`
    driver: local            # kept on this machine's disk, in Docker's own storage
  pgdata:
    name: porter-pgdata
    driver: local
